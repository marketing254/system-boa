<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Business of Aesthetics | System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f10;
      color: #f5f5f5;
      text-align: center;
      padding: 2rem;
    }
    .card { max-width: 480px; }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #c9a96e;
      border: 1px solid #c9a96e;
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 0.75rem; }
    p { color: #a0a0a0; line-height: 1.6; }
    a { color: #c9a96e; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 2.5rem; font-size: 0.8rem; color: #666; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Coming soon</span>
    <h1>Business of Aesthetics System</h1>
    <p>This area is currently being set up. Please check back shortly.</p>
    <p style="margin-top:1rem">Back to <a href="https://businessofaesthetics.org">businessofaesthetics.org</a></p>
    <footer>&copy; 2026 Business of Aesthetics</footer>
